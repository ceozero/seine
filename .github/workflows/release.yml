name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的版本标签（例如 v1.2.3）
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: seine-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: seine-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features || '' }}

      - name: Package (Unix)
        if: runner.os != 'Windows' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/${{ matrix.name }}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/seine" "${stage}/seine"
          cp LICENSE "${stage}/SEINE-LICENSE.txt"
          cp README.md "${stage}/README.md"
          (
            cd "${stage}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum README.md SEINE-LICENSE.txt seine > SHA256SUMS.txt
            else
              shasum -a 256 README.md SEINE-LICENSE.txt seine > SHA256SUMS.txt
            fi
          )
          tar -C "${stage}" -czf "${GITHUB_WORKSPACE}/${{ matrix.name }}.tar.gz" .

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate archive checksums
        run: sha256sum seine-*.tar.gz > SHA256SUMS.txt

      - name: Extract changelog section for this tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found = 1; next }
            /^## v/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "Using CHANGELOG.md section for $RELEASE_TAG"
          else
            echo "::warning::No CHANGELOG.md section for $RELEASE_TAG; release body will only have generated notes"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            SHA256SUMS.txt
            seine-*.tar.gz
          generate_release_notes: true
